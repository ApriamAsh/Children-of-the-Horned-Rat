name: Package Foundry system

on:
  push:
    branches:
      - main
    paths:
      - 'system.json'
      - 'scripts/**'
      - 'styles/**'
      - 'templates/**'
      - 'lang/**'
      - 'README.md'
      - 'LICENSE.txt'
      - '.github/workflows/package-foundry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate manifest
        run: node -e "const m = require('./system.json'); if (!m.id || !m.version || !m.esmodules) process.exit(1); console.log(m.id + ' ' + m.version)"
      - name: Build installable ZIP
        run: zip -r careerless-wfrp.zip system.json README.md LICENSE.txt lang scripts styles templates
      - name: Publish latest installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view foundry-latest >/dev/null 2>&1 || gh release create foundry-latest --title "Foundry Install Package (Latest)" --notes "Automatically packaged installable Foundry VTT system build from the main branch."
          gh release upload foundry-latest careerless-wfrp.zip --clobber
          gh release edit foundry-latest --title "Foundry Install Package (Latest)" --notes "Automatically packaged installable Foundry VTT system build from the main branch."
